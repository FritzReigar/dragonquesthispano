baseURL = "https://dragonquesthispano.com"
languageCode = "es-ES"
title = "Dragon Quest Hispano"
theme = "PaperMod"
defaultContentLanguage = "es"

[params]
  description = "La primera comunidad hispanohablante dedicada a toda la saga Dragon Quest. Guías, noticias, tier lists y más."
  author = "Fritz Reigar"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  mainSections = ["guias", "tier-lists", "noticias"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Noticias"
    url = "/noticias/"
    weight = 1
  [[menu.main]]
    name = "Guías"
    url = "/guias/"
    weight = 2
  [[menu.main]]
    name = "Tier Lists"
    url = "/tier-lists/"
    weight = 3